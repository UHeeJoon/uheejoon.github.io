<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유희준 | 리모델링 중</title>
  <meta name="description" content="포트폴리오를 새로 단장하고 있습니다.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg-1: #fff7ee; --bg-2: #ffeef2; --bg-3: #eef4ff;
      --ink: #2b2330; --ink-2: #6b6170; --accent: #ff8a5b; --accent-2: #ffc53d;
      --card: rgb(255 255 255 / .72); --line: rgb(43 35 48 / .08);
      --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans); color: var(--ink); overflow-x: hidden;
      background:
        radial-gradient(60vmax 60vmax at 12% 8%, var(--bg-2), transparent 60%),
        radial-gradient(55vmax 55vmax at 92% 20%, var(--bg-3), transparent 60%),
        var(--bg-1);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100svh; padding: 24px 16px 40px;
    }
    .stage { position: relative; width: min(560px, 100%); aspect-ratio: 1 / .74; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation;
      -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 78%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 78%, transparent 100%); }
    .bubble {
      position: absolute; left: 50%; top: 2%; transform: translateX(-50%);
      background: #fff; border-radius: 18px; padding: 10px 16px; font-size: 15px; font-weight: 650;
      box-shadow: 0 8px 24px -10px rgb(43 35 48 / .25); white-space: nowrap; pointer-events: none;
      animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both;
    }
    .bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -8px; width: 16px; height: 16px; background: #fff;
      transform: translateX(-50%) rotate(45deg); border-radius: 3px;
    }
    @keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.85); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
    .copy { text-align: center; max-width: 520px; margin-top: 4px; word-break: keep-all; }
    .tag {
      display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #b8561f;
      background: #fff1e6; border: 1px solid #ffd9bf; border-radius: 999px; padding: 4px 12px;
    }
    .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    h1 { font-size: clamp(26px, 5vw, 36px); letter-spacing: -.02em; margin: 14px 0 10px; }
    p.lead { margin: 0 0 22px; color: var(--ink-2); font-size: 16px; line-height: 1.7; }
    .progress {
      height: 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); overflow: hidden; margin: 0 auto 24px; width: min(360px, 100%);
    }
    .progress span {
      display: block; height: 100%; width: 68%; border-radius: inherit;
      background: repeating-linear-gradient(-45deg, var(--accent-2) 0 10px, var(--accent) 10px 20px);
      background-size: 28px 28px; animation: stripes 1s linear infinite;
    }
    @keyframes stripes { to { background-position: 28px 0; } }
    .cta {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; font-weight: 700; font-size: 15px;
      background: var(--ink); padding: 12px 22px; border-radius: 999px; box-shadow: 0 10px 24px -12px rgb(43 35 48 / .6);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgb(43 35 48 / .6); }
    .hint { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); opacity: .8; }
    .fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 96px; }
    .no-webgl .fallback { display: flex; }
    .no-webgl #scene, .no-webgl .hint { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .progress span, .tag i { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="scene" aria-label="공사 모자를 쓴 캐릭터가 망치질을 하는 3D 장면"></canvas>
    <div class="fallback" aria-hidden="true">🚧</div>
    <div class="bubble" id="bubble" aria-live="polite">뚝딱뚝딱, 새 단장 중이에요!</div>
  </div>

  <div class="copy">
    <span class="tag"><i></i>리모델링 중</span>
    <h1>포트폴리오를 새로 꾸미고 있어요</h1>
    <p class="lead">더 보기 좋게 다시 정리하는 중입니다. 조금만 기다려 주세요.<br>DevOps 포트폴리오는 지금 바로 볼 수 있어요.</p>
    <div class="progress" role="progressbar" aria-label="리모델링 진행 중" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><span></span></div>
    <a class="cta" href="devops/">DevOps 포트폴리오 보기 <span aria-hidden="true">→</span></a>
    <div class="hint">캐릭터를 눌러 보세요</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('scene');
    const bubble = document.getElementById('bubble');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (e) {
      document.body.classList.add('no-webgl');
      throw e;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 2.0, 8.4);
    camera.lookAt(0, 1.05, 0);

    // ---------- 조명 ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0xffd9c7, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(3, 6, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -4; key.shadow.camera.right = 4;
    key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
    key.shadow.radius = 6;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffc9e0, 1.2);
    rim.position.set(-4, 3, -4);
    scene.add(rim);

    // ---------- 재질 ----------
    const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.42, metalness: 0, ...o });
    const M = {
      body: mat(0xfff3e3, { roughness: 0.5, emissive: 0x3a2a1a, emissiveIntensity: 0.35 }),
      hat: mat(0xffc53d, { roughness: 0.3 }),
      hatDark: mat(0xf3a712, { roughness: 0.35 }),
      eye: mat(0x2b2330, { roughness: 0.15 }),
      shine: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      cheek: new THREE.MeshBasicMaterial({ color: 0xff9db0, transparent: true, opacity: 0.75 }),
      wood: mat(0xc98b55, { roughness: 0.6 }),
      metal: mat(0x9aa3b5, { roughness: 0.25, metalness: 0.7 }),
      cone: mat(0xff7a45, { roughness: 0.45 }),
      white: mat(0xffffff, { roughness: 0.4 }),
      brick: mat(0xe8836b, { roughness: 0.7 }),
      vest: mat(0xff8a5b, { roughness: 0.5 }),
      lamp: new THREE.MeshStandardMaterial({ color: 0xfff2a8, emissive: 0xffd24d, emissiveIntensity: 1.2 }),
    };
    const mesh = (geo, m, shadow = true) => { const o = new THREE.Mesh(geo, m); o.castShadow = shadow; o.receiveShadow = true; return o; };

    // ---------- 바닥 그림자 ----------
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.12 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const ease = (k) => { k = Math.min(1, Math.max(0, k)); return k * k * (3 - 2 * k); };

    // ---------- 반짝이 ----------
    const sparks = [];
    const sparkGeo = new THREE.OctahedronGeometry(0.07);
    const PAL = {
      spark: [0xffd24d, 0xff8a5b, 0xffffff],
      dust: [0xe3ddd3, 0xc9c2b6, 0xffffff],
      paint: [0xff9db0, 0xffd24d, 0x8fd3ff],
    };
    function burst(at, n = 7, pal = PAL.spark, power = 1) {
      for (let i = 0; i < n; i++) {
        const s = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: pal[i % pal.length], transparent: true }));
        s.position.copy(at);
        s.scale.setScalar(power < 1 ? 0.7 : 1);
        const a = Math.random() * Math.PI * 2;
        s.userData.v = new THREE.Vector3(Math.cos(a) * 1.6 * power, (1.8 + Math.random() * 1.6) * power, Math.sin(a) * 0.8 * power);
        s.userData.life = 0;
        scene.add(s); sparks.push(s);
      }
    }

    // ---------- 캐릭터 ----------
    function makeChar(cfg) {
      const bodyM = mat(cfg.color, { roughness: 0.5, emissive: cfg.color, emissiveIntensity: 0.12 });
      const innerM = mat(cfg.inner || 0xffb6c8, { roughness: 0.55 });
      const root = new THREE.Group(), spin = new THREE.Group(), squash = new THREE.Group(), look = new THREE.Group();
      root.add(spin); spin.add(squash); squash.add(look);

      const body = mesh(new THREE.SphereGeometry(1, 64, 48), bodyM);
      body.scale.set(1.05, 0.95, 0.98); body.position.y = 1.15;
      look.add(body);

      const C = new THREE.Vector3(0, 1.15, 0);
      const fl = cfg.faceLift || 0;
      function onSurface(obj, x, y, lift = 0) {
        const dir = new THREE.Vector3(x, y, Math.sqrt(Math.max(0, 1 - x * x - y * y)));
        const p = C.clone().add(new THREE.Vector3(dir.x * 1.05, dir.y * 0.95, dir.z * 0.98).multiplyScalar(1 + lift));
        obj.position.copy(p);
        obj.lookAt(p.clone().add(dir));
        look.add(obj);
        return obj;
      }

      // 펭귄 배와 얼굴
      if (cfg.belly) {
        const patch = mesh(new THREE.SphereGeometry(1, 48, 32), M.white);
        patch.scale.set(0.8, 0.86, 0.46); patch.position.set(0, 1.05, 0.6);
        look.add(patch);
      }

      // 조끼 띠
      const vest = mesh(new THREE.TorusGeometry(0.98, 0.07, 16, 80), mat(cfg.vest));
      vest.rotation.x = Math.PI / 2; vest.position.y = 0.78; vest.scale.set(1.06, 1, 1);
      look.add(vest);

      // 귀
      for (const s of [-1, 1]) {
        if (cfg.ears === 'long') {
          const g = new THREE.Group();
          const e = mesh(new THREE.SphereGeometry(1, 32, 24), bodyM); e.scale.set(0.2, 0.62, 0.14); e.position.y = 0.5;
          const i = mesh(new THREE.SphereGeometry(1, 32, 24), innerM, false); i.scale.set(0.11, 0.46, 0.07); i.position.set(0, 0.48, 0.08);
          g.add(e, i); g.position.set(s * 0.36, 1.86, -0.05); g.rotation.z = s < 0 ? 0.22 : -0.55;
          look.add(g);
        } else if (cfg.ears === 'round') {
          const e = mesh(new THREE.SphereGeometry(0.3, 32, 24), bodyM); e.scale.set(1, 1, 0.6); e.position.set(s * 0.74, 1.84, -0.05);
          const i = mesh(new THREE.SphereGeometry(0.17, 24, 16), innerM, false); i.scale.set(1, 1, 0.4); i.position.set(s * 0.74, 1.83, 0.1);
          look.add(e, i);
        } else if (cfg.ears === 'pointy') {
          const g = new THREE.Group();
          const e = mesh(new THREE.ConeGeometry(0.27, 0.5, 24), bodyM); e.position.y = 0.2; e.scale.z = 0.6;
          const i = mesh(new THREE.ConeGeometry(0.15, 0.3, 24), innerM, false); i.position.set(0, 0.15, 0.09); i.scale.z = 0.4;
          g.add(e, i); g.position.set(s * 0.62, 1.82, -0.02); g.rotation.z = -s * 0.42;
          look.add(g);
        } else if (cfg.ears === 'tiny') {
          const e = mesh(new THREE.SphereGeometry(0.2, 24, 16), bodyM); e.scale.set(1, 1, 0.6); e.position.set(s * 0.76, 1.76, 0.02);
          const i = mesh(new THREE.SphereGeometry(0.11, 24, 16), innerM, false); i.scale.set(1, 1, 0.4); i.position.set(s * 0.76, 1.75, 0.12);
          look.add(e, i);
        }
      }

      // 눈
      const eyes = [];
      for (const s of [-1, 1]) {
        const eye = new THREE.Group();
        const ball = mesh(new THREE.SphereGeometry(0.15, 32, 24), M.eye, false);
        ball.scale.set(1, 1.25, 0.55);
        const shine = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), M.shine);
        shine.position.set(0.045, 0.07, 0.07);
        const shine2 = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), M.shine);
        shine2.position.set(-0.04, -0.05, 0.07);
        eye.add(ball, shine, shine2);
        if (cfg.frog) {
          const bump = mesh(new THREE.SphereGeometry(0.3, 32, 24), bodyM);
          onSurface(bump, s * 0.4, 0.42, -0.1);
          eye.position.copy(bump.position).add(new THREE.Vector3(0, 0.04, 0.26));
          look.add(eye);
        } else {
          onSurface(eye, s * 0.32, 0.1, fl);
        }
        eyes.push(eye);

        if (cfg.pouch) {
          const p = mesh(new THREE.SphereGeometry(0.3, 32, 24), mat(cfg.pouch, { roughness: 0.5 }));
          p.scale.set(1, 0.85, 0.6);
          onSurface(p, s * 0.58, -0.2, -0.04);
        }
        const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.13, 32), M.cheek);
        onSurface(cheek, s * 0.56, -0.13, 0.012 + fl + (cfg.pouch ? 0.1 : 0));

        if (cfg.whiskers) {
          for (const k of [-1, 1]) {
            const w = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.3, 6).rotateZ(Math.PI / 2), M.eye);
            onSurface(w, s * 0.7, -0.06 + k * 0.06, 0.02);
            w.rotateZ(k * 0.18 * s);
          }
        }
      }

      // 입
      if (cfg.beak) {
        const beak = mesh(new THREE.ConeGeometry(0.11, 0.24, 24).rotateX(Math.PI / 2), mat(cfg.beak));
        onSurface(beak, 0, -0.08, fl + 0.06);
      } else {
        if (cfg.muzzle) {
          const mz = mesh(new THREE.SphereGeometry(0.3, 32, 24), mat(cfg.muzzle, { roughness: 0.55 }));
          mz.scale.set(1.15, 0.8, 0.55);
          onSurface(mz, 0, -0.16, -0.08);
          const nose = mesh(new THREE.SphereGeometry(0.075, 24, 16), M.eye, false);
          nose.scale.set(1.3, 0.9, 0.8);
          onSurface(nose, 0, -0.07, 0.09);
        }
        const r = cfg.frog ? 0.17 : 0.085;
        const mouth = new THREE.Mesh(new THREE.TorusGeometry(r, 0.024, 12, 32, Math.PI), M.eye);
        onSurface(mouth, 0, cfg.muzzle ? -0.2 : -0.1, cfg.muzzle ? 0.075 : 0.01 + fl);
        mouth.rotateZ(Math.PI);
      }

      // 꼬리
      if (cfg.tail) {
        const tail = mesh(new THREE.TorusGeometry(0.3, 0.08, 12, 32, Math.PI * 1.25), bodyM);
        tail.position.set(0.25, 0.7, -0.95); tail.rotation.set(0, Math.PI / 2, 0.4);
        look.add(tail);
      }

      // 안전모
      const hat = new THREE.Group();
      const hatM = mat(cfg.hat, { roughness: 0.3 });
      const dome = mesh(new THREE.SphereGeometry(0.78, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), hatM);
      dome.scale.set(1, 0.82, 1);
      const brim = mesh(new THREE.CylinderGeometry(0.98, 1.0, 0.07, 48), hatM);
      brim.position.set(0, 0.02, 0.12);
      const ridge = mesh(new THREE.TorusGeometry(0.62, 0.06, 12, 48, Math.PI), hatM);
      ridge.rotation.y = Math.PI / 2; ridge.scale.set(1, 1.05, 1);
      const lampBase = mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.1, 24), M.eye);
      lampBase.rotation.x = Math.PI / 2 - 0.5; lampBase.position.set(0, 0.42, 0.62);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), M.lamp);
      lamp.position.set(0, 0.45, 0.68);
      hat.add(dome, brim, ridge, lampBase, lamp);
      hat.scale.setScalar(0.8);
      hat.position.set(0, 1.93, -0.02);
      hat.rotation.set(-0.08, 0, 0.1);
      look.add(hat);

      // 팔과 발
      function arm(side) {
        const pivot = new THREE.Group();
        pivot.position.set(side * 0.98, 1.05, 0.05);
        const upper = mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.5, 20), bodyM);
        upper.position.y = -0.25;
        const hand = mesh(new THREE.SphereGeometry(0.18, 24, 16), bodyM);
        hand.position.y = -0.55;
        pivot.add(upper, hand);
        squash.add(pivot);
        return { pivot, hand };
      }
      const armL = arm(-1), armR = arm(1);
      const footM = cfg.feet ? mat(cfg.feet) : bodyM;
      for (const s of [-1, 1]) {
        const foot = mesh(new THREE.SphereGeometry(0.26, 24, 16), footM);
        foot.scale.set(1, 0.55, 1.3);
        foot.position.set(s * 0.42, 0.14, 0.15);
        squash.add(foot);
      }
      return { root, spin, squash, look, armL, armR, eyes };
    }

    // ---------- 공용 소품 ----------
    function cone(x, z, s = 1) {
      const g = new THREE.Group();
      const base = mesh(new THREE.BoxGeometry(0.9, 0.08, 0.9), M.cone);
      base.position.y = 0.04;
      const c = mesh(new THREE.ConeGeometry(0.34, 1.05, 32), M.cone);
      c.position.y = 0.58;
      const band1 = mesh(new THREE.CylinderGeometry(0.255, 0.285, 0.13, 32), M.white);
      band1.position.y = 0.42;
      const band2 = mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.11, 32), M.white);
      band2.position.y = 0.78;
      g.add(base, c, band1, band2);
      g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = 0.4;
      scene.add(g);
      return g;
    }
    const bgeo = new THREE.BoxGeometry(0.62, 0.28, 0.32);
    const popScale = (k) => 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2);

    // ---------- 하는 일 ----------
    const JOBS = {
      // 망치질
      hammer(ch) {
        scene.add(ch.root);
        cone(-2.25, 0.2, 1); cone(-2.85, -0.9, 0.75);
        const tool = new THREE.Group();
        const handle = mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.85, 16), M.wood);
        handle.position.y = -0.3;
        const head = mesh(new THREE.BoxGeometry(0.42, 0.18, 0.18), M.metal);
        head.position.y = -0.72;
        tool.add(handle, head); tool.position.y = -0.5;
        ch.armR.pivot.add(tool);
        const bricks = new THREE.Group();
        [[-0.33, 0.14, 0], [0.33, 0.14, 0], [0, 0.42, 0.02]].forEach(([x, y, z], i) => {
          const b = mesh(bgeo, M.brick); b.position.set(x, y, z); b.rotation.y = (i - 1) * 0.06; bricks.add(b);
        });
        bricks.position.set(2.05, 0, 0.75); bricks.rotation.y = -0.35;
        scene.add(bricks);
        let prev = -1;
        return {
          hop: 0.1,
          update(t) {
            ch.armL.pivot.rotation.set(-0.25, 0, -2.6 + Math.sin(t * 6) * 0.35);
            const phase = (t * 1.3) % 1;
            const swing = phase < 0.7 ? phase / 0.7 : 1 - (phase - 0.7) / 0.3;
            ch.armR.pivot.rotation.set(0, -0.45, 2.5 - ease(swing) * 1.2);
            const k = Math.floor(t * 1.3 - 0.7);
            if (k > prev) { head.getWorldPosition(tmp); burst(tmp, 5); bricks.scale.y = 0.9; }
            prev = k;
            bricks.scale.y += (1 - bricks.scale.y) * 0.2;
          },
        };
      },

      // 벽돌 쌓기
      bricklay(ch) {
        scene.add(ch.root);
        ch.root.position.set(-0.5, 0, 0.35); ch.root.rotation.y = 0.5;
        cone(-2.5, -0.6, 0.85);
        const held = mesh(bgeo, M.brick);
        held.position.set(0, -0.62, 0.05); held.rotation.z = Math.PI / 2;
        ch.armR.pivot.add(held);
        const supply = new THREE.Group();
        for (let i = 0; i < 4; i++) { const b = mesh(bgeo, M.brick); b.position.set(0, 0.14 + i * 0.28, 0); b.rotation.y = i * 0.15; supply.add(b); }
        supply.position.set(-1.9, 0, 0.6); supply.rotation.y = 0.3;
        scene.add(supply);
        const wall = new THREE.Group();

        const drum = new THREE.Group();

        const cw = mesh(new THREE.BoxGeometry(0.4, 0.62, 1.02), Yd); cw.position.set(-0.72, 0.6, 0);

        const seat = mesh(new THREE.BoxGeometry(0.5, 0.12, 0.6), K); seat.position.set(-0.22, 0.78, 0);
        const back = mesh(new THREE.BoxGeometry(0.1, 0.5, 0.6), K); back.position.set(-0.5, 1.02, 0);
        fk.add(seat, back);
        for (const [x, z] of [[0.45, 0.46], [0.45, -0.46], [-0.62, 0.46], [-0.62, -0.46]]) {
          const p = mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.6, 10), K); p.position.set(x, 1.5, z); fk.add(p);
        }
        const roof = mesh(new THREE.BoxGeometry(1.2, 0.06, 1.0), Yd); roof.position.set(-0.08, 2.3, 0); fk.add(roof);
        const revM = new THREE.MeshStandardMaterial({ color: 0xffa94d, emissive: 0xff7a1a, emissiveIntensity: 0.1 });
        const rev = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), revM); rev.position.set(-0.6, 2.38, 0); fk.add(rev);
        const col = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 10), K); col.position.set(0.42, 0.95, 0); col.rotation.z = 0.5; fk.add(col);
        const steer = mesh(new THREE.TorusGeometry(0.15, 0.028, 10, 28), K); steer.position.set(0.32, 1.17, 0); steer.rotation.set(0, Math.PI / 2, 0.5); fk.add(steer);
        for (const z of [0.3, -0.3]) { const m = mesh(new THREE.BoxGeometry(0.07, 1.95, 0.07), G); m.position.set(0.82, 1.08, z); fk.add(m); }
        const carriage = new THREE.Group(); carriage.position.set(0.88, 0.15, 0); fk.add(carriage);

        const pallet = mesh(new THREE.BoxGeometry(0.64, 0.1, 0.64), M.wood); pallet.position.set(0.42, 0.08, 0);

        const tape = mesh(new THREE.BoxGeometry(0.1, 0.01, 0.53), mat(0xfff4dc)); tape.position.set(0.42, 0.595, 0);

      // 착암기
      drill(ch) {
        scene.add(ch.root);
        ch.root.position.set(-0.45, 0, 0.3);
        cone(-2.35, 0.1, 0.95); cone(-2.9, -1.0, 0.7);
        // 손잡이가 오른손에 오도록 팔에 붙이고 팔 각도만큼 되돌려 항상 똑바로 세운다
        const ARM = 0.45, JS = 1.2;
        const jh = new THREE.Group();
        const bit = mesh(new THREE.CylinderGeometry(0.04, 0.012, 0.11, 12), M.metal); bit.position.y = 0.055;
        const bodyJ = mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.27, 24), mat(0xffc53d, { roughness: 0.35 })); bodyJ.position.y = 0.23;
        const band = mesh(new THREE.CylinderGeometry(0.152, 0.152, 0.05, 24), M.eye); band.position.y = 0.14;
        const cap = mesh(new THREE.CylinderGeometry(0.1, 0.13, 0.07, 24), M.eye); cap.position.y = 0.4;
        const post = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 10), M.eye); post.position.y = 0.45;
        const bar = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 12).rotateX(Math.PI / 2), M.eye); bar.position.y = 0.48;
        for (const z of [0.21, -0.21]) { const g = mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.1, 12).rotateX(Math.PI / 2), mat(0xff6b6b)); g.position.set(0, 0.48, z); jh.add(g); }
        jh.add(bit, bodyJ, band, cap, post, bar);
        const holder = new THREE.Group();
        holder.position.y = -0.55;
        jh.scale.setScalar(JS); jh.position.y = -0.48 * JS;
        holder.add(jh);
        ch.armR.pivot.add(holder);
        const hx = -0.45 + 0.98 + 0.55 * Math.sin(ARM);
        const cracks = new THREE.Group();
        for (let i = 0; i < 6; i++) {
          const c = new THREE.Mesh(new THREE.BoxGeometry(0.28 + Math.random() * 0.22, 0.005, 0.025), M.eye);
          const a = (i / 6) * Math.PI * 2 + Math.random() * 0.4;
          c.position.set(Math.cos(a) * 0.26, 0.004, Math.sin(a) * 0.26); c.rotation.y = -a;
          cracks.add(c);
        }
        cracks.position.set(hx, 0, 0.35); cracks.scale.setScalar(0.001);
        scene.add(cracks);
        let lastDust = 0;
        const job = {
          hop: 0.1,
          update(t, dt, now) {
            const on = now % 3.4 < 2.4;
            const buzz = on ? Math.sin(now * 70) : 0;
            const armZ = ARM + buzz * 0.025;
            ch.armR.pivot.rotation.set(0, 0, armZ);
            holder.rotation.z = -armZ;
            jh.position.y = -0.48 * JS + (on ? Math.abs(Math.sin(now * 35)) * 0.035 : 0);
            ch.root.position.x = -0.45 + buzz * 0.012;
            if (on) {
              ch.armL.pivot.rotation.set(0, 0, -1.15 + buzz * 0.06);
              cracks.scale.setScalar(Math.min(1, cracks.scale.x + dt * 0.5));
              if (now - lastDust > 0.12) { lastDust = now; tmp.set(hx, 0.05, 0.35); burst(tmp, 2, PAL.dust, 0.55); }
              job.hop = 0.012;
            } else {
              ch.armL.pivot.rotation.set(-0.6, 0, -2.5 + Math.sin(now * 8) * 0.25);
              job.hop = 0.06;
              if (now % 3.4 > 3.3) cracks.scale.setScalar(0.001);
            }
          },
        };
        return job;
      },
    };

    // ---------- 배경 ----------
    function box(w, h, d, color, x, y, z, ry = 0, parent = scene) {
      const m = mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'number' ? mat(color) : color);
      m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
    }
    function textTex(text, bg, fg, w = 512, h = 192) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      g.strokeStyle = fg; g.lineWidth = 10; g.strokeRect(14, 14, w - 28, h - 28);
      g.fillStyle = fg; g.font = `800 ${Math.round(h * 0.42)}px "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 4);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
      return t;
    }
    function sign(text, x, y, z, ry = 0, w = 1.1, h = 0.42, bg = '#ffd23f', fg = '#2b2330') {
      const g = new THREE.Group();
      const board = mesh(new THREE.BoxGeometry(w, h, 0.05), [M.white, M.white, M.white, M.white,
        new THREE.MeshStandardMaterial({ map: textTex(text, bg, fg), roughness: 0.5 }), M.white]);
      board.position.y = y;
      g.add(board);
      for (const s of [-1, 1]) { const p = mesh(new THREE.CylinderGeometry(0.03, 0.03, y, 8), M.metal); p.position.set(s * w * 0.35, y / 2, -0.04); g.add(p); }
      g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
      return g;
    }
    function platform(top, side) {
      const p = mesh(new THREE.CylinderGeometry(3.6, 3.7, 0.16, 72), mat(side, { roughness: 0.8 }));
      p.position.set(0, -0.08, -0.6); p.castShadow = false; scene.add(p);
      const t = mesh(new THREE.CircleGeometry(3.6, 72), mat(top, { roughness: 0.9 }), false);
      t.rotation.x = -Math.PI / 2; t.position.set(0, 0.002, -0.6); scene.add(t);
      return t;
    }
    function barricade(x, z, ry = 0, s = 1) {
      const g = new THREE.Group();
      for (const k of [-1, 1]) {
        const leg = mesh(new THREE.BoxGeometry(0.06, 0.9, 0.06), M.white); leg.position.set(k * 0.6, 0.45, 0); leg.rotation.x = 0.15; g.add(leg);
        const leg2 = leg.clone(); leg2.rotation.x = -0.15; g.add(leg2);

      for (let i = 0; i < 8; i++) box(0.18, 0.2, 0.05, i % 2 ? M.white : M.cone, -0.63 + i * 0.18, 0.72, 0.05, 0, g);
      g.position.set(x, 0, z); g.rotation.y = ry; g.scale.setScalar(s); scene.add(g);
      return g;
    }
    function warnLamp(parent, x, y, z) {

      const l = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), m); l.position.set(x, y, z); parent.add(l);

    const BACKDROPS = {
      // 집 뼈대를 세우는 공사장
      hammer() {
        platform(0xd5ebbf, 0xb7d69c);
        const wood = mat(0xd9a46c, { roughness: 0.7 });
        const frame = new THREE.Group(); frame.position.set(-0.6, 0, -2.6); scene.add(frame);
        for (const x of [-1.5, -0.5, 0.5, 1.5]) box(0.14, 2.1, 0.14, wood, x, 1.05, 0, 0, frame);
        box(3.3, 0.14, 0.16, wood, 0, 2.12, 0, 0, frame);
        box(3.3, 0.12, 0.14, wood, 0, 1.05, 0, 0, frame);
        for (const s of [-1, 1]) { const r = box(1.95, 0.13, 0.15, wood, s * 0.82, 2.72, 0, 0, frame); r.rotation.z = -s * 0.62; }
        const brace = box(1.3, 0.1, 0.1, wood, -1.0, 0.55, 0.02, 0, frame); brace.rotation.z = 0.65;
        barricade(2.4, -1.7, -0.25);
        sign('공사 중', 2.4, 1.45, -1.75, -0.25);
        for (const [x, z] of [[-1.1, 1.6], [1.0, 1.9]]) { const b = mesh(new THREE.SphereGeometry(0.28, 16, 12), mat(0x9fd18b)); b.scale.y = 0.6; b.position.set(x, 0.1, z); scene.add(b); }
      },

      // 반쯤 올라간 벽돌집
      bricklay() {
        platform(0xf3e2c0, 0xe0c99c);
        const wall = new THREE.Group(); wall.position.set(-0.4, 0, -2.5); scene.add(wall);
        const shades = [0xe8836b, 0xdc7560, 0xef9378];
        for (let r = 0; r < 5; r++) {
          const cols = 7 - r;
          for (let c = 0; c < cols; c++) {
            box(0.62, 0.28, 0.32, shades[(r + c) % 3], -2.0 + c * 0.64 + (r % 2 ? 0.32 : 0), 0.14 + r * 0.29, 0, 0, wall);
          }
        }
        const pole = mat(0x8f96a3, { roughness: 0.3, metalness: 0.5 });
        const plank = mat(0xd9a46c, { roughness: 0.7 });
        const sc = new THREE.Group(); sc.position.set(2.3, 0, -2.2); sc.rotation.y = -0.3; scene.add(sc);
        for (const x of [-0.6, 0.6]) for (const z of [-0.3, 0.3]) box(0.06, 2.4, 0.06, pole, x, 1.2, z, 0, sc);
        for (const y of [1.0, 2.0]) { box(1.4, 0.06, 0.7, plank, 0, y, 0, 0, sc); box(1.3, 0.05, 0.05, pole, 0, y + 0.45, 0.32, 0, sc); }
        const sand = mesh(new THREE.ConeGeometry(0.75, 0.6, 32), mat(0xf0d391, { roughness: 1 })); sand.position.set(-2.4, 0.3, -1.3); scene.add(sand);
      },

      // 칠하는 중인 방
      paint() {
        platform(0xeed6b4, 0xd8b98f);
        const floor = new THREE.Group(); scene.add(floor);
        for (let i = -5; i <= 5; i++) box(0.02, 0.003, 7, 0xd9bd95, i * 0.62, 0.004, -0.6, 0, floor);
        const back = new THREE.Group(); back.position.set(0, 0, -2.6); scene.add(back);
        box(6.4, 3.3, 0.12, 0xfbf6ee, 0, 1.65, 0, 0, back);
        box(4.2, 1.2, 0.02, 0xbfe6d6, -1.1, 0.6, 0.07, 0, back);
        const win = new THREE.Group(); win.position.set(1.3, 1.85, 0.08); back.add(win);
        box(1.3, 1.1, 0.04, 0xbfe3ff, 0, 0, 0, 0, win);
        box(1.42, 0.08, 0.08, M.white, 0, 0.58, 0.02, 0, win); box(1.42, 0.08, 0.08, M.white, 0, -0.58, 0.02, 0, win);
        box(0.08, 1.2, 0.08, M.white, 0.68, 0, 0.02, 0, win); box(0.08, 1.2, 0.08, M.white, -0.68, 0, 0.02, 0, win);
        box(0.05, 1.1, 0.06, M.white, 0, 0, 0.02, 0, win); box(1.3, 0.05, 0.06, M.white, 0, 0, 0.02, 0, win);
        const pic = box(0.7, 0.5, 0.04, 0xffd6e0, -1.6, 2.1, 0.08, 0, back); pic.rotation.z = 0.12;
        const lad = new THREE.Group(); lad.position.set(-2.3, 0, -1.9); lad.rotation.set(-0.18, 0.3, 0); scene.add(lad);
        const wood = mat(0xd9a46c, { roughness: 0.7 });
        for (const x of [-0.3, 0.3]) box(0.07, 2.3, 0.07, wood, x, 1.15, 0, 0, lad);
        for (let i = 0; i < 6; i++) box(0.6, 0.05, 0.06, wood, 0, 0.3 + i * 0.36, 0, 0, lad);
        const cloth = mesh(new THREE.PlaneGeometry(2.2, 1.2), mat(0xe9eef3, { roughness: 1 }), false);
        cloth.rotation.set(-Math.PI / 2, 0, 0.15); cloth.position.set(0.9, 0.008, -1.4); scene.add(cloth);
        [[0xffb3c7, 0.6, -1.3, 0.16], [0xa8dcff, 1.3, -1.6, 0.11], [0xffe08a, 0.2, -1.7, 0.09]].forEach(([c, x, z, r]) => {
          const d = new THREE.Mesh(new THREE.CircleGeometry(r, 20), mat(c)); d.rotation.x = -Math.PI / 2; d.position.set(x, 0.012, z); scene.add(d);
        });
      },

      // 크레인이 있는 현장
      concrete() {
        platform(0xe6d3b5, 0xcdb58f);
        const Y = mat(0xffc53d, { roughness: 0.35 });
        const crane = new THREE.Group(); crane.position.set(-2.1, 0, -2.9); scene.add(crane);
        for (const x of [-0.14, 0.14]) for (const z of [-0.14, 0.14]) box(0.05, 2.7, 0.05, Y, x, 1.35, z, 0, crane);
        for (let i = 0; i < 9; i++) { const b = box(0.4, 0.04, 0.04, Y, 0, 0.15 + i * 0.3, 0.15, 0, crane); b.rotation.z = i % 2 ? 0.6 : -0.6; }
        box(0.36, 0.36, 0.4, 0xffffff, 0.25, 2.55, 0.05, 0, crane);
        const jib = new THREE.Group(); jib.position.y = 2.8; crane.add(jib);
        box(4.0, 0.12, 0.12, Y, 1.4, 0, 0, 0, jib);
        box(0.9, 0.12, 0.12, Y, -0.9, 0, 0, 0, jib);
        box(0.35, 0.3, 0.3, 0x5b6273, -1.2, -0.12, 0, 0, jib);
        const hook = new THREE.Group(); hook.position.set(2.6, 0, 0); jib.add(hook);
        const cable = mesh(new THREE.CylinderGeometry(0.01, 0.01, 1.3, 6), M.eye); cable.position.y = -0.65; hook.add(cable);
        box(0.5, 0.18, 0.32, M.brick, 0, -1.35, 0, 0, hook);
        for (const [x, z, r, c] of [[2.4, -2.0, 0.6, 0xd4cbbd], [1.6, -2.6, 0.45, 0xc6b79f]]) {
          const g = mesh(new THREE.ConeGeometry(r, r * 0.9, 28), mat(c, { roughness: 1 })); g.position.set(x, r * 0.45, z); scene.add(g);
        }
        barricade(-0.3, -2.4, 0.05, 0.9);
        return (t) => { jib.rotation.y = Math.sin(t * 0.35) * 0.35; hook.rotation.z = Math.sin(t * 1.4) * 0.08; };
      },

      // 창고
      forklift() {
        platform(0xdfe2e8, 0xc4c8d1);
        const lane = mat(0xffd23f);
        for (const z of [-0.35, 1.05]) box(6.2, 0.006, 0.07, lane, 0, 0.006, z);
        const rack = new THREE.Group(); rack.position.set(0, 0, -2.6); scene.add(rack);
        const up = mat(0x4d7cc7, { roughness: 0.4 }), beam = mat(0xff8a3d, { roughness: 0.4 });
        for (const x of [-2.7, -0.9, 0.9, 2.7]) for (const z of [-0.35, 0.35]) box(0.08, 2.9, 0.08, up, x, 1.45, z, 0, rack);
        const boxes = [0xdba56b, 0xe8bd85, 0xc99358, 0xf1cfa0];
        for (const y of [0.15, 1.15, 2.15]) {
          for (const z of [-0.35, 0.35]) box(5.5, 0.08, 0.08, beam, 0, y, z, 0, rack);
          for (let b = 0; b < 6; b++) {
            if ((b + y * 3) % 5 < 1) continue;
            const h = 0.4 + ((b * 7 + y * 10) % 3) * 0.12;
            box(0.62, h, 0.6, boxes[b % 4], -2.25 + b * 0.9, y + 0.04 + h / 2, 0, (b % 2) * 0.08, rack);
          }
        }
        sign('창고', -2.3, 2.95, -2.15, 0, 0.9, 0.36, '#2b2330', '#ffd23f');
      },

      // 도로 공사
      drill() {
        platform(0xb9bfca, 0xa3aab6);
        const dash = mat(0xffffff);
        for (let i = -4; i <= 4; i++) box(0.45, 0.006, 0.08, dash, i * 0.8, 0.006, 1.3);
        const patch = new THREE.Mesh(new THREE.CircleGeometry(0.9, 32), mat(0x9aa1ad, { roughness: 1 }));
        patch.rotation.x = -Math.PI / 2; patch.position.set(0.25, 0.005, 0.35); patch.scale.set(1.2, 0.8, 1); scene.add(patch);
        const lamps = [];
        for (const [x, z, ry] of [[-1.4, -2.0, 0.1], [1.4, -2.1, -0.1]]) {
          barricade(x, z, ry);
          lamps.push(warnLamp(scene, x + 0.55, 1.0, z));
        }
        const pole = mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 10), M.metal); pole.position.set(2.6, 1.1, -1.4); scene.add(pole);
        const diamond = mesh(new THREE.BoxGeometry(0.72, 0.72, 0.04), [M.white, M.white, M.white, M.white,
          new THREE.MeshStandardMaterial({ map: textTex('공사', '#ffd23f', '#2b2330', 256, 256), roughness: 0.5 }), M.white]);
        diamond.position.set(2.6, 2.05, -1.36); scene.add(diamond);
        const manhole = new THREE.Mesh(new THREE.CircleGeometry(0.32, 28), mat(0x6f7684, { roughness: 0.6 }));
        manhole.rotation.x = -Math.PI / 2; manhole.position.set(-1.7, 0.007, 1.0); scene.add(manhole);
        return (t) => lamps.forEach((m, i) => (m.emissiveIntensity = Math.sin(t * 6 + i * Math.PI) > 0 ? 2.4 : 0.15));
      },
    };

    // ---------- 일꾼 목록 ----------
    const COMMON = ['조금만 기다려 주세요!', 'DevOps 포트폴리오는 먼저 볼 수 있어요', '새로고침하면 다른 친구가 와요'];
    const CHARS = [
      { name: '몽실', kind: '토끼', job: 'hammer', color: 0xe6dcff, inner: 0xffb8cf, ears: 'long', hat: 0xffc53d, vest: 0xff8a5b,
        lines: ['몽실이가 뚝딱뚝딱 고치는 중이에요!', '못 하나만 더 박을게요!'] },
      { name: '도토리', kind: '곰', job: 'bricklay', color: 0xc99b6e, inner: 0xf2c9a5, ears: 'round', muzzle: 0xf5e1c8, hat: 0x6ec6ff, vest: 0xffd23f,
        lines: ['도토리가 벽돌을 차곡차곡 쌓는 중이에요!', '한 장, 두 장, 세 장…'] },
      { name: '치즈', kind: '고양이', job: 'paint', color: 0xffc983, inner: 0xffa9b8, ears: 'pointy', whiskers: true, tail: true, hat: 0xff8fb1, vest: 0x7bd389,
        lines: ['치즈가 벽을 새로 칠하는 중이에요!', '이번엔 무슨 색으로 칠할까요?'] },
      { name: '퐁당', kind: '개구리', job: 'concrete', color: 0xa9e5a0, frog: true, hat: 0xffc53d, vest: 0xff8a5b,
        lines: ['퐁당이가 공구리 치는 중이에요!', '시멘트 굳기 전에 서둘러요!'] },
      { name: '뽀글', kind: '펭귄', job: 'forklift', color: 0x5d6e98, belly: true, beak: 0xffa53d, feet: 0xffa53d, faceLift: 0.1, hat: 0xffc53d, vest: 0xff6b6b,
        lines: ['뽀글이가 지게차로 짐을 나르는 중이에요!', '짐 조심하세요!'] },
      { name: '콩떡', kind: '햄스터', job: 'drill', color: 0xffe1bf, inner: 0xffb8c6, ears: 'tiny', pouch: 0xfff4e8, hat: 0xffc53d, vest: 0x4dabf7,
        lines: ['콩떡이가 바닥을 새로 까는 중이에요!', '두두두두두두!'] },
    ];

    let idx = parseInt(new URLSearchParams(location.search).get('worker'), 10);
    if (!(idx >= 0 && idx < CHARS.length)) {
      let last = -1;
      try { const v = localStorage.getItem('worker-last'); if (v !== null) last = +v; } catch (e) {}
      do { idx = Math.floor(Math.random() * CHARS.length); } while (idx === last);
      try { localStorage.setItem('worker-last', String(idx)); } catch (e) {}
    }
    const cfg = CHARS[idx];
    const ch = makeChar(cfg);
    const job = JOBS[cfg.job](ch);
    const bgUpdate = BACKDROPS[cfg.job] ? BACKDROPS[cfg.job]() : null;
    const baseY = ch.root.position.y;
    canvas.setAttribute('aria-label', `안전모를 쓴 ${cfg.kind} ${cfg.name}가 일하는 3D 장면`);
    document.querySelector('.hint').textContent = `오늘의 일꾼은 ${cfg.kind} ${cfg.name} · 눌러 보세요 · 새로고침하면 다른 친구가 와요`;
    // ---------- 크기 ----------
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas);
    resize();

    // ---------- 상호작용 ----------
    const pointer = new THREE.Vector2(0, 0);
    addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -((e.clientY / innerHeight) * 2 - 1);
    });

    const lines = [...cfg.lines, ...COMMON];
    let line = 0, jumpT = -1;
    function say(text) {
      bubble.textContent = text;
      bubble.style.animation = 'none';
      void bubble.offsetWidth;
      bubble.style.animation = '';
    }
    say(lines[0]);
    job.onBeep = () => { if (jumpT < 0) say('삐- 삐- 후진합니다!'); };
    canvas.addEventListener('click', () => {
      if (jumpT >= 0) return;
      jumpT = 0;
      line = (line + 1) % lines.length;
      say(lines[line]);
      ch.look.getWorldPosition(tmp); tmp.y += 2.2 * ch.root.scale.y;
      burst(tmp, 12);
    });
    setInterval(() => { if (jumpT < 0) { line = (line + 1) % lines.length; say(lines[line]); } }, 5200);

    // ---------- 애니메이션 ----------
    const clock = new THREE.Clock();
    const speed = reduce ? 0.35 : 1;
    let nextBlink = 1.5, blinkT = -1;

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const now = clock.elapsedTime * speed;
      const t = now;

      // 통통 튀는 기본 동작
      const hop = Math.abs(Math.sin(t * 2.4));
      let y = hop * job.hop;
      const sq = 1 - (1 - hop) * job.hop * 0.5;

      // 클릭하면 점프하며 한 바퀴
      if (jumpT >= 0) {
        jumpT += dt * 1.6;
        const k = Math.min(jumpT, 1);
        y += Math.sin(k * Math.PI) * 1.1;
        ch.spin.rotation.y = k * Math.PI * 2;
        if (jumpT >= 1) { jumpT = -1; ch.spin.rotation.y = 0; }
      }
      ch.root.position.y = baseY + y;
      ch.squash.scale.set(1 + (1 - sq) * 0.8, sq, 1 + (1 - sq) * 0.8);

      // 시선 따라가기
      const lb = job.lookBase || 0;
      ch.look.rotation.y += (lb + pointer.x * 0.55 - ch.look.rotation.y) * 0.08;
      ch.look.rotation.x += (-pointer.y * 0.18 - ch.look.rotation.x) * 0.08;

      job.update(t, dt, now);
      if (bgUpdate) bgUpdate(t);

      // 눈 깜빡임
      if (blinkT < 0 && now > nextBlink) blinkT = 0;
      if (blinkT >= 0) {
        blinkT += dt * 9;
        const s = blinkT < 1 ? 1 - blinkT : blinkT < 2 ? blinkT - 1 : 1;
        ch.eyes.forEach((e) => (e.scale.y = Math.max(0.08, s)));
        if (blinkT >= 2) { blinkT = -1; nextBlink = now + 2 + Math.random() * 3; }
      }

      // 안전모 램프
      M.lamp.emissiveIntensity = 0.8 + Math.sin(t * 5) * 0.5;

      // 반짝이
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.userData.life += dt;
        s.userData.v.y -= 6 * dt;
        s.position.addScaledVector(s.userData.v, dt);
        s.rotation.x += dt * 6; s.rotation.y += dt * 4;
        s.material.opacity = Math.max(0, 1 - s.userData.life / 0.8);
        if (s.userData.life > 0.8) { scene.remove(s); s.material.dispose(); sparks.splice(i, 1); }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
  <script>
    // three.js를 불러오지 못하면 대체 그림 표시
    setTimeout(function () {
      var c = document.getElementById('scene');
      if (!c.width || c.width === 300 && c.height === 150) document.body.classList.add('no-webgl');
    }, 4000);
  </script>
</body>
</html>
